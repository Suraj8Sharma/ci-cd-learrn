name: FastAPI CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # -----------------------------------
  # JOB 1: THE LINTER
  # -----------------------------------
  lint-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'  # <--- CACHING ENABLED
          
      - name: Install Flake8
        run: pip install flake8
        
      - name: Run Linter
        run: flake8 . --count --show-source --statistics

  # -----------------------------------
  # JOB 2: THE TESTER
  # -----------------------------------
  test-job:
    runs-on: ubuntu-latest
    needs: lint-job
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'  # <--- CACHING ENABLED
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
          
      - name: Run Pytest
        # Injecting dummy secrets specifically for the testing environment
        env:
          SECRET_KEY: "dummy_test_key_for_ci_only"
          ALGORITHM: "HS256"
        run: pytest test_main.py -v

  # -----------------------------------
  # JOB 3: THE DOCKER BUILDER (CD)
  # -----------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    needs: test-job
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          # Injecting real secrets securely from the GitHub Vault
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-fastapi-app:latest
          
      - name: Trigger Render Deployment
        run: curl "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"