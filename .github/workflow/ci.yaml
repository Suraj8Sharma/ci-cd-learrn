#this is the new code for the ci.yaml file with the linter and the test job separated into two jobs with the test job depending on the linter job to pass first before running the tests
name: FastAPI CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  # -----------------------------------
  # JOB 1: THE LINTER
  # -----------------------------------
  lint-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Flake8
        run: pip install flake8
        
      - name: Run Linter
        # This command tells Flake8 to scan the current directory (".")
        # and print out statistics about the errors it finds.
        run: flake8 . --count --show-source --statistics

  # -----------------------------------
  # JOB 2: THE TESTER
  # -----------------------------------
  test-job:
    runs-on: ubuntu-latest
    needs: lint-job  # <--- MAGIC KEYWORD: Wait for lint-job to pass first!
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
          
      - name: Run Pytest
        run: pytest