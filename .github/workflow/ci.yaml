name: FastAPI CI Pipeline

# 1. THE TRIGGER
on:
  pull_request:
    branches:
      - main

# 2. THE SERVER
jobs:
  test-fastapi-app:
    runs-on: ubuntu-latest
    
    # 3. THE INSTRUCTIONS
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
          
      - name: Run Tests
        run: pytest